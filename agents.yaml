# AgentGov agent registry - Day 1
# Two agents only. No admin agent. Deployer comes later.
agents:
  - id: infra-drafter
    group: infra-drafters
    owner: Shivoy Malhotra
    status: active
    risk_tier: medium
    capability: DRAFT_WRITE
    compartment_write: Drafts
    can_never:
      - audit_own_draft
      - deploy
      - read_production
  - id: security-auditor
    group: security-auditors
    owner: Shivoy Malhotra
    status: active
    risk_tier: medium
    capability: AUDIT_WRITE
    compartment_write: Audit-Results
    can_never:
      - write_draft
      - write_production
      - change_policy
