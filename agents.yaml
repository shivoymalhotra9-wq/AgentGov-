# AgentGov agent registry - Day 1 fix
# Three agents only. No admin agent. No agent deploys to Production.
agents:
  - id: infra-drafter
    group: infra-drafters
    owner: Shivoy Malhotra
    status: active
    risk_tier: medium
    capability: DRAFT_WRITE
    compartment_write: Drafts
    can_never:
      - audit_own_draft
      - deploy
      - read_production
  - id: security-auditor
    group: security-auditors
    owner: Shivoy Malhotra
    status: active
    risk_tier: medium
    capability: AUDIT_WRITE
    compartment_write: Audit-Results
    can_never:
      - write_draft
      - write_production
      - change_policy
  - id: infra-deployer-nonprod
    group: infra-deployers-nonprod
    owner: Shivoy Malhotra
    status: active
    risk_tier: medium
    capability: DEPLOY_WRITE
    compartment_write: Non-Production
    compartment_read: Drafts
    can_never:
      - write_draft
      - write_production
      - audit
      - approve
      - change_policy
